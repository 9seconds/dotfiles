# https://sw.kovidgoyal.net/kitty/conf/#window-layout

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.remember_window_size
initial_window_width 300c
initial_window_height 55c

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.enabled_layouts
# https://sw.kovidgoyal.net/kitty/layouts/#the-splits-layout
enabled_layouts splits:equalize_on_window_close=true;proportional=true,stack

# https://sw.kovidgoyal.net/kitty/custom-shaders/#navigation
custom_shaders dim-inactive-windows

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.hide_window_decorations
hide_window_decorations no

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.confirm_os_window_close
confirm_os_window_close 0
