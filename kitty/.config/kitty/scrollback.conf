# https://sw.kovidgoyal.net/kitty/conf/#scrollback

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.scrollback_lines
scrollback_lines 10000

# sw.kovidgoyal.net/kitty/conf/#opt-kitty.scrollbar_width
scrollbar_width 0.8

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.scrollbar_width
scrollbar_hover_width 1.8

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.scrollbar_width
scrollback_pager_history_size 256

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.scrollback_pager
# # LESSUTFCHARDEF was coming from Terra. This is related to icons
scrollback_pager env LESSUTFCHARDEF=E000-F8FF:p,F0000-FFFFD:p,100000-10FFFD:p less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
