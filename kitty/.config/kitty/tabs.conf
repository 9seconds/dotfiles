# https://sw.kovidgoyal.net/kitty/conf/#tab-bar

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.tab_bar_edge
tab_bar_edge top

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.tab_bar_style
tab_bar_style separator

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.tab_separator
tab_separator " "

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.tab_title_wrap
tab_title_wrap yes

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.tab_title_max_length
tab_title_max_lines 50

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.tab_title_template
tab_title_template " {bell_symbol}{index}: {title} "
