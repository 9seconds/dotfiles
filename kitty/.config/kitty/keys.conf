# https://sw.kovidgoyal.net/kitty/conf/#keyboard-shortcuts

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.clear_all_shortcuts
clear_all_shortcuts yes

###############################################################################
# https://sw.kovidgoyal.net/kitty/actions/#copy-paste

# https://sw.kovidgoyal.net/kitty/actions/#action-copy_to_clipboard
map kitty_mod+c copy_or_noop

# https://sw.kovidgoyal.net/kitty/actions/#action-paste_from_clipboard
map kitty_mod+v paste_from_clipboard

###############################################################################
# https://sw.kovidgoyal.net/kitty/actions/#font-sizes

# https://sw.kovidgoyal.net/kitty/actions/#action-change_font_size
# https://sw.kovidgoyal.net/kitty/conf/#conf-kitty-shortcuts-fonts
map kitty_mod+= change_font_size all +0.5
map kitty_mod+- change_font_size all -0.5
map kitty_mod+0 change_font_size all 0

###############################################################################
# https://sw.kovidgoyal.net/kitty/actions/#miscellaneous

# https://sw.kovidgoyal.net/kitty/actions/#action-clear_terminal
map kitty_mod+k clear_terminal reset active

# https://sw.kovidgoyal.net/kitty/actions/#action-edit_config_file
map kitty_mod+, edit_config_file

# https://sw.kovidgoyal.net/kitty/actions/#action-input_unicode_character
map kitty_mod+shift+p input_unicode_character

###############################################################################
# https://sw.kovidgoyal.net/kitty/actions/#scrolling

# https://sw.kovidgoyal.net/kitty/actions/#action-scroll_to_prompt
map kitty_mod+page_up scroll_to_prompt -1
map kitty_mod+page_down scroll_to_prompt 1

# https://sw.kovidgoyal.net/kitty/actions/#action-search_scrollback
map kitty_mod+/ search_scrollback
map kitty_mod+shift+/ show_last_visited_command_output

map kitty_mod+shift+c launch --stdin-source=@last_visited_cmd_output --type clipboard

###############################################################################
# https://sw.kovidgoyal.net/kitty/actions/#tab-management

# https://sw.kovidgoyal.net/kitty/actions/#action-close_tab
map kitty_mod+q close_tab

# https://sw.kovidgoyal.net/kitty/actions/#action-new_tab
map kitty_mod+t new_tab_with_cwd

# https://sw.kovidgoyal.net/kitty/actions/#action-set_tab_title
map kitty_mod+r set_tab_title

# https://sw.kovidgoyal.net/kitty/actions/#action-goto_tab
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+\ select_tab

###############################################################################
# https://sw.kovidgoyal.net/kitty/actions/#window-management

map kitty_mod+d launch --location=vsplit --cwd=current
map kitty_mod+shift+d launch --location=hsplit --cwd=current

# https://sw.kovidgoyal.net/kitty/actions/#action-set_window_title
map kitty_mod+shift+r set_window_title

# https://sw.kovidgoyal.net/kitty/actions/#action-toggle_layout
map kitty_mod+z toggle_layout stack

# https://sw.kovidgoyal.net/kitty/actions/#action-new_os_window_with_cwd
map kitty_mod+n new_os_window_with_cwd

# https://sw.kovidgoyal.net/kitty/actions/#action-new_os_window
map kitty_mod+shift+n new_os_window

# https://sw.kovidgoyal.net/kitty/actions/#action-neighboring_window
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window bottom
map kitty_mod+k neighboring_window top
map kitty_mod+l neighboring_window right

# https://sw.kovidgoyal.net/kitty/actions/#action-toggle_fullscreen
map kitty_mod+f toggle_fullscreen
