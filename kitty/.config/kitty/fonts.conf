# https://sw.kovidgoyal.net/kitty/conf/#fonts

# BEGIN_KITTY_FONTS
font_family      family="Maple Mono" features="calt cv01 cv02 cv31 cv32 cv34 cv35 cv36 cv37 cv61 ss03 ss05 ss07 ss08 ss09 ss10 ss11"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.font_size
font_size 14

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.modify_font
modify_font cell_height 140%
modify_font baseline -1
