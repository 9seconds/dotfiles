[tool.ruff]
line-length = 80
exclude = [
    ".git"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "EM101",
    "EM102",
    "TRY003",
    "TRY400",
    "BLE001",
    "PLW0603",
    "S301",
    "COM812",
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
lines-after-imports = 2
required-imports = [
    "from __future__ import annotations"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyrefly]
# https://pyrefly.org/en/docs/configuration/#preset
preset = "strict"
# https://pyrefly.org/en/docs/configuration/#python-version
python-version = "3.10"
# https://pyrefly.org/en/docs/configuration/#disable-project-excludes-heuristics
disable-project-excludes-heuristics = true
# https://pyrefly.org/en/docs/configuration/#disable-search-path-heuristics
disable-search-path-heuristics = true
# https://pyrefly.org/en/docs/configuration/#min-severity
min-severity = "warn"
# https://pyrefly.org/en/docs/configuration/#project-includes
project-includes = [
    "**/*.py*",
    "dots",
    "git/.local/bin/git-br",
    "git/.local/bin/git-wt",
    "bin/.local/bin/9s-cache",
    "bin/.local/bin/9s-retry",
    "bin/.local/bin/9s-tmo",
]
# https://pyrefly.org/en/docs/configuration/#search-path
search-path = [
    "./bin/.local/share/9seconds/pythonpath",
]
# https://pyrefly.org/en/docs/configuration/#disable-type-errors-in-ide
disable-type-errors-in-ide = true

[tool.pyrefly.errors]
# enable why python-version >= 3.12
missing-override-decorator = false
