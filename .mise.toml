[env]
PYTHONPATH = "{{ config_root }}/bin/.local/share/9seconds/pythonpath"

# -----------------------------------------------------------------------------

[vars]
dots_source = "{{ config_root | canonicalize | quote }}"
dots_target = "{{ env.HOME | canonicalize | quote }}"

# -----------------------------------------------------------------------------

[tools]
"github:sharkdp/fd" = "latest"
"github:meta/pyrefly" = "latest"
"github:astral-sh/ruff" = "latest"

# -----------------------------------------------------------------------------

[tasks."plug"]
description = "Plug module"
usage = '''
arg "<module>" {
  double_dash optional
  help "Name of the plug to connect to"
}
'''
wait_for = [
  "discover"
]
run = "./dots -s {{ vars.dots_source }} -t {{ vars.dots_target }} plug $usage_module"

[tasks."unplug"]
description = "Plug module"
usage = '''
arg "<module>" {
  double_dash optional
  help "Name of the plug to connect to"
}
'''
wait_for = [
  "discover"
]
run = "./dots -s {{ vars.dots_source }} -t {{ vars.dots_target }} unplug $usage_module"

[tasks."discover"]
description = "Discover modules"
run = "./dots -s {{ vars.dots_source }} -t {{ vars.dots_target }} discover"

[tasks.python]
description = "Run Python tasks"
run = [
  "pyrefly check",
  "ruff check",
  "ruff format"
]

[tasks.lua]
description = "Run Lua tasks"
run = "fd -e lua -H -t file -X luafmt --config luafmt.toml --level lua-jit --write"
